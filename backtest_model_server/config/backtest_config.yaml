# Backtest Model Server Configuration
# ------------------------------------
# Run scripts/01_pull_data.py → 02_prepare_ohlcv.py → 03_run_infer_backtest.py →
#          04_compute_metrics.py → 05_plot_dashboard.py

# --- Date range ---
start_date: "2026-04-10"
end_date: "2026-04-18"

# --- Model server ---
server_url: "http://localhost:4001"
strategy: "default"          # legacy single-strategy fallback (ignored when `strategies` is set)
# Multi-strategy parallel backtest. When set, run_all_strategies.py runs step 3
# for every entry concurrently (each hits the same model server) and writes
# per-strategy outputs to results/<strategy>/ and plots/<strategy>/.
strategies:
  - "simulation_14_1h"
  - "simulation_14_15min"
  - "simulation_14_5min"
api_key: test-key-123 # override with MODEL_API_KEY env var

# --- Portfolio ---
initial_capital_usd: 100.0

# --- Simulation (realistic, ported from simulation_14) ---
cadence_hours: 1 # inference frequency (hours between steps)
tick_spacing: 10 # Uniswap V3 tick spacing for ETH/USDC 0.05%

# Pool & position economics (matches Kongtrae v3 training/eval defaults)
pool_prefix: "eth_usdc_0p05" # B2 prefix. Must match the model/eval pool, not just a similar ETH stablecoin pool.
pool_fee: 0.0005 # 0.05% fee tier
decimals0: 18 # WETH decimals
decimals1: 6 # USDC decimals

# Transaction costs
gas_cost_usd: 0.03 # gas per trade
mev_slippage_pct: 0.0001 # 0.01% MEV/slippage per swap

# Hedge parameters (continuous delta hedge via perps)
hedge_ratio: 1.0 # fraction of ETH delta hedged (1.0 = full hedge, matches training)
funding_rate_annual: 0.048 # 4.8% annual perp funding rate

# Hedge accounting mode: continuous_delta_hedged | idealized_perfect | none
hedge_accounting_mode: "continuous_delta_hedged"

# Validation threshold: halt if swap-derived vs Binance median price error exceeds this.
binance_deviation_threshold_pct: 0.9

# --- Serving ---
max_retries: 3 # retry on 503
retry_backoff_base: 1.0 # exponential backoff base (seconds)
request_timeout: 30 # seconds per request
concurrency: 1 # sequential (reference_date bypasses server cache)

# --- Output ---
output_dir: "results"
plots_dir: "plots"
